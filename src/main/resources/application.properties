server.port=${HTTP_PORT:8080}

spring.application.name=vendornex-api

spring.threads.virtual.enabled=true

spring.mvc.throw-exception-if-no-handler-found=true

spring.web.resources.add-mappings=false

# Entities map onto the schema Migrator.java already applied.
# Hibernate never generates or alters DDL.
# ddl-auto=validate only double-checks entity mappings against the live schema.
# open-in-view is explicitly off.
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate

spring.jpa.properties.hibernate.cache.use_second_level_cache=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC