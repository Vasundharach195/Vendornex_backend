server.port=${HTTP_PORT:8092}

# Every URL is served under this prefix, e.g. /vmsb1/api/auth/login. Set CONTEXT_PATH to change it
# (CONTEXT_PATH=/ serves from the root again).
server.servlet.context-path=${CONTEXT_PATH:/vmsb1}

spring.application.name=vendornex-api

spring.threads.virtual.enabled=true

spring.mvc.throw-exception-if-no-handler-found=true

spring.web.resources.add-mappings=false

# Entities map onto the schema Migrator.java already applied.
# Hibernate never generates or alters DDL.
# ddl-auto is none (not validate): tenant tables live in one schema per company, so there is
# no single schema to validate the entity mappings against at startup.
# open-in-view is explicitly off.
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=none

spring.jpa.properties.hibernate.cache.use_second_level_cache=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC